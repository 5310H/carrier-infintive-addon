name: Infinitive
version: 0.1.4
slug: infinitive
description: Local interface for Carrier Infinity and Bryant Evolution HVAC systems
url: https://github.com/5310H/carrier-infintive-addon
arch:
  - amd64
startup: services
boot: auto
stage: stable
init: false
apparmor: true
uart: true
udev: true
webui: http://[HOST]:[PORT:8081]
ports:
  8080/tcp: 8081
ports_description:
  8080/tcp: Infinitive web interface and API
options:
  serial_device: /dev/ttyUSB0
schema:
  serial_device: str
